name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - ci/**
      - feature/**
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: annotation
          POSTGRES_USER: annotation
          POSTGRES_PASSWORD: annotation-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U annotation -d annotation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://annotation:annotation-test-password@localhost:5432/annotation
      SECRET_KEY: ci-secret-key
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
      DB_POOL_MIN_SIZE: 1
      DB_POOL_MAX_SIZE: 8
      DB_POOL_TIMEOUT_SECONDS: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Initialize database schema
        run: python -c "from backend.database import init_db; from backend.annotation.migrations import ensure_annotation_schema_columns; init_db(); ensure_annotation_schema_columns()"

      - name: Run backend tests
        run: python -m pytest backend/tests -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

  mcp:
    name: MCP import check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp_server/requirements.txt

      - name: Install dependencies
        run: pip install -r mcp_server/requirements.txt

      - name: Compile MCP server
        run: python -m py_compile mcp_server/server.py
