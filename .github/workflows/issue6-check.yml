name: Issue 6 generic annotation checks

on:
  push:
    branches:
      - feat/issue-6-generic-annotation-schema
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: annotation
          POSTGRES_USER: annotation
          POSTGRES_PASSWORD: annotation-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U annotation -d annotation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://annotation:annotation-test-password@localhost:5432/annotation
      SECRET_KEY: issue6-ci-secret-key
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
      DB_POOL_MIN_SIZE: 1
      DB_POOL_MAX_SIZE: 8
      DB_POOL_TIMEOUT_SECONDS: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt pytest
      - name: Initialize PostgreSQL schema
        run: python -c "from backend.database import init_db; from backend.annotation.migrations import ensure_annotation_schema_columns; init_db(); ensure_annotation_schema_columns()"
      - name: Run backend tests
        run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck and build frontend
        run: npm run build
