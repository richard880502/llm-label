name: Publish GitHub Release

# Explicit manual action only. Never publish on push or after a PR merge.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to publish, e.g. v5.5.0 (must match frontend/package.json)"
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-github-release
  cancel-in-progress: false

jobs:
  publish:
    name: Validate, tag and publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the selected main commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version and main revision
        env:
          RELEASE_TAG: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release version must be vMAJOR.MINOR.PATCH (e.g. v5.5.0)."
            exit 1
          fi

          app_version="$(node -p "require('./frontend/package.json').version")"
          if [[ "$RELEASE_TAG" != "v$app_version" ]]; then
            echo "::error::Requested $RELEASE_TAG does not match main package version v$app_version."
            exit 1
          fi

          remote_main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$GITHUB_SHA" != "$remote_main_sha" ]]; then
            echo "::error::main changed since this workflow started; launch a fresh run on main."
            exit 1
          fi

      - name: Require successful main-branch checks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          for workflow in ci.yml docker.yml codeql.yml; do
            conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$GITHUB_SHA&event=push&per_page=10" --jq '.workflow_runs[0].conclusion // "missing"')"
            echo "$workflow: $conclusion"
            if [[ "$conclusion" != "success" ]]; then
              echo "::error::$workflow has not succeeded on main at $GITHUB_SHA ($conclusion). Re-run this workflow after checks pass."
              exit 1
            fi
          done

      - name: Prepare release notes from CHANGELOG
        env:
          RELEASE_TAG: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          awk -v tag="$RELEASE_TAG" '
            $0 == "## " tag " 更新重點" { section=1; next }
            section && /^## / { exit }
            section { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"

          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::CHANGELOG.md has no release notes under '## $RELEASE_TAG 更新重點'."
            exit 1
          fi

      - name: Create annotated Git tag if needed
        env:
          RELEASE_TAG: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists."
            exit 1
          fi

          if git ls-remote --exit-code --refs --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            # A failed release may have left the correctly pointed tag behind.
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "::error::Existing tag $RELEASE_TAG points at $tag_sha, not $GITHUB_SHA."
              exit 1
            fi
            echo "Existing tag $RELEASE_TAG points to the expected commit; resuming."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Release $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Publish GitHub Release
        env:
          RELEASE_TAG: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

          release_url="$(gh release view "$RELEASE_TAG" --json url --jq '.url')"
          {
            echo "## Published $RELEASE_TAG"
            echo "Release: $release_url"
            echo "Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
