name: Coolify deployment

# Coolify deploys every push to main by itself (auto-deploy webhook). This workflow does NOT start a
# deployment: it waits for the Coolify deployment of the pushed commit and reports the result to GitHub,
# so it shows up under Deployments (environment, URL, Active) and as a green or red check on the commit.
#
# Configuration (Settings > Secrets and variables > Actions):
#   secret   COOLIFY_API_TOKEN   Coolify API token (read permission is enough)
#   variable COOLIFY_URL         e.g. https://richard-coolify.duckdns.org
#   variable COOLIFY_APP_UUIDS   space separated Coolify application UUIDs that this repo deploys
#   variable DEPLOY_ENV_NAME     GitHub environment name (default: production)
#   variable DEPLOY_ENV_URL      public URL shown next to the deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: coolify-deployment-${{ github.ref }}
  cancel-in-progress: false

env:
  COOLIFY_URL: ${{ vars.COOLIFY_URL }}
  APP_UUIDS: ${{ vars.COOLIFY_APP_UUIDS }}
  COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}

jobs:
  check:
    # Pull requests only verify that the Coolify API and token work. Nothing is deployed or reported.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the Coolify API and token
        run: |
          set -euo pipefail
          if [ -z "${COOLIFY_TOKEN:-}" ]; then
            echo "::notice::COOLIFY_API_TOKEN is not available for this run (Dependabot or fork). Skipping."
            exit 0
          fi
          for u in $APP_UUIDS; do
            code=$(curl -sS -o /tmp/app.json -w '%{http_code}' \
              -H "Authorization: Bearer $COOLIFY_TOKEN" -H 'Accept: application/json' \
              "$COOLIFY_URL/api/v1/applications/$u")
            if [ "$code" != "200" ]; then
              echo "::error::Coolify returned HTTP $code for application $u"
              exit 1
            fi
            echo "OK: $(jq -r '.name + " (" + (.status // "unknown") + ")"' /tmp/app.json)"
          done

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: ${{ vars.DEPLOY_ENV_NAME || 'production' }}
      url: ${{ vars.DEPLOY_ENV_URL }}
    steps:
      - name: Wait for the Coolify deployment of this commit
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${COOLIFY_TOKEN:-}" ]; then
            echo "::error::Secret COOLIFY_API_TOKEN is not set"
            exit 1
          fi
          api() {
            curl -sS --retry 3 --retry-delay 5 \
              -H "Authorization: Bearer $COOLIFY_TOKEN" -H 'Accept: application/json' \
              "$COOLIFY_URL/api/v1/$1"
          }
          fail=0
          for u in $APP_UUIDS; do
            name=$(api "applications/$u" | jq -r '.name // "app"')
            echo "::group::$name ($u)"

            # 1) find the deployment that Coolify started for this commit (up to ~6 minutes)
            dep=""
            for i in $(seq 1 24); do
              dep=$(api "deployments/applications/$u?skip=0&take=15" \
                | jq -r --arg sha "$SHA" '[.deployments[] | select(.commit == $sha)] | sort_by(.created_at) | last | .deployment_uuid // empty')
              [ -n "$dep" ] && break
              sleep 15
            done
            if [ -z "$dep" ]; then
              echo "::error::Coolify did not start a deployment of $SHA for $name within 6 minutes. Check auto-deploy and the GitHub webhook."
              echo "- $name: **no deployment started** for \`${SHA:0:7}\`" >> "$GITHUB_STEP_SUMMARY"
              fail=1
              echo "::endgroup::"
              continue
            fi
            echo "Deployment: $dep"

            # 2) wait until it finishes (up to ~40 minutes)
            status=""
            for i in $(seq 1 160); do
              status=$(api "deployments/$dep" | jq -r '.status // "unknown"')
              case "$status" in finished|failed|cancelled-by-user|cancelled) break ;; esac
              sleep 15
            done
            echo "Final status: $status"
            log=$(api "deployments/$dep" | jq -r '.deployment_url // empty')
            [ -n "$log" ] && echo "Coolify log: ${COOLIFY_URL}${log}"
            echo "- $name: **$status** (deployment \`$dep\`, commit \`${SHA:0:7}\`)" >> "$GITHUB_STEP_SUMMARY"
            if [ "$status" != "finished" ]; then
              echo "::error::$name deployment ended as '$status'"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail
