worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    client_max_body_size 100m;

    server {
        listen 8080;
        server_name _;

        location = /mcp {
            # OAuth tokens are checked before MCP receives initialize or tool calls.
            # Legacy apt_ tokens remain valid for CLI / developer clients.
            auth_request /_internal/mcp-auth;
            error_page 401 = @mcp_oauth_required;
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_set_header Host 127.0.0.1:8000;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Authorization $http_authorization;
        }

        location = /_internal/mcp-auth {
            internal;
            proxy_pass http://127.0.0.1:8001/api/oauth/mcp-auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
        }

        location @mcp_oauth_required {
            add_header WWW-Authenticate 'Bearer resource_metadata="https://$host/.well-known/oauth-protected-resource/mcp"' always;
            return 401;
        }

        location / {
            proxy_pass http://127.0.0.1:8001;
            proxy_http_version 1.1;
            # Preserve a non-default port too: RFC 9728 requires the resource
            # value in discovery metadata to exactly match the MCP URL.
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
    }
}
